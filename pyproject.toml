[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llav"
version = "0.1.0"
description = "Large Language Verdicts: typed semantic decisions from a local model over a System One style HTTP API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llav = "llav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llav = ["webui.html"]
