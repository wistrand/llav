# Publishes docs/ as the GitHub Pages site with the paper's PDF and HTML copied in from paper/, so the copies
# are never committed. Requires the repository's Pages source to be set to "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: [docs/**, paper/order-shouldnt-matter.pdf, paper/order-shouldnt-matter.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p site/paper
          cp -r docs/. site/
          cp paper/order-shouldnt-matter.pdf paper/order-shouldnt-matter.html site/paper/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
